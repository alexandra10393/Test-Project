name: Motore Unico (All-in-One)

on:
  schedule:
    - cron: '*/10 6-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Orario Italiano (08:00 - 02:00)
        id: check-time
        run: |
          hour=$(TZ="Europe/Rome" date +%-H)
          echo "Ora italiana: $hour"
          if [ "$hour" -ge 8 ] || [ "$hour" -lt 2 ]; then
            echo "✅ Orario operativo. Procedo."
            echo "run_bot=true" >> $GITHUB_OUTPUT
          else
            echo "💤 Orario notturno. Bot a nanna."
            echo "run_bot=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.check-time.outputs.run_bot == 'true'
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        if: steps.check-time.outputs.run_bot == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python Dependencies
        if: steps.check-time.outputs.run_bot == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Esecuzione Bot
        if: steps.check-time.outputs.run_bot == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER: ${{ secrets.IG_USER }}
        run: |
          echo "🚀 Avvio bot con xvfb..."
          timeout 450 xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python -u main.py
          echo "📊 Esito: $?"

      - name: 📱 Mostra log telefono
        if: always()
        run: |
          echo "📱 ULTIME RIGHE LOG TELEFONO:"
          [ -f "log_telefono.txt" ] && tail -20 log_telefono.txt || echo "File non trovato"
          echo "📄 CONTENUTO HISTORY.TXT:"
          [ -f "history.txt" ] && { wc -l history.txt; tail -5 history.txt; } || echo "File non trovato"

      - name: Upload Debug Files
        if: always() && steps.check-time.outputs.run_bot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bot-debug-files
          path: |
            *.txt
            *.json
            *.log
            *.png
            *.html
          retention-days: 2

      - name: Commit history.txt
        if: steps.check-time.outputs.run_bot == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f history.txt ]; then
            git add -f history.txt
            if ! git diff --cached --quiet; then
              git commit -m "Auto-update history.txt [skip ci]"
              git push origin HEAD:${GITHUB_REF_NAME}
            else
              echo "Nessuna modifica in history.txt"
            fi
          fi
